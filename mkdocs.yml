site_name: django-spec-rest
site_description: Serve django-service-specs kernel specs over Django REST Framework.
site_url: https://artui.github.io/django-spec-rest/
repo_url: https://github.com/Artui/django-spec-rest
repo_name: Artui/django-spec-rest
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # The docstrings here cross-reference the kernel's specs, seats and
          # refusals, so those targets resolve to the kernel's own site.
          inventories:
            - https://artui.github.io/django-service-specs/objects.inv
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            line_length: 88
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - OpenAPI: openapi.md
  - Moving from djangorestframework-services: moving-from-drfs.md
  - Recipes:
      - recipes/index.md
      - Viewsets and custom actions: recipes/service-action.md
      - View hooks and providers: recipes/extra-kwargs.md
      - DRF permission classes: recipes/permissions.md
      - Filter a selector with filter_set: recipes/selector-filtering.md
      - Serializer context: recipes/serializer-context.md
      - Calling a spec off HTTP: recipes/off-http-inputs.md
  - Reference:
      - reference/index.md
      - Views: reference/views.md
      - Viewsets: reference/viewsets.md
      - DRF seats: reference/service-specs.md
      - Types: reference/types.md
      - OpenAPI: reference/openapi.md

# Anchor drift is silent otherwise: a rename moves a heading, every in-page link
# to its old id still resolves to the page and lands at the top, and nothing says
# so. `--strict` turns these into build failures, which is what CI already runs.
validation:
  anchors: warn
  links:
    absolute_links: warn
    unrecognized_links: warn
