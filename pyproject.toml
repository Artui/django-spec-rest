[project]
name = "django-spec-rest"
dynamic = ["version"]
description = "A service-oriented layer for Django REST Framework: precise, controllable side effects for mutating endpoints."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Artur Veres", email = "artur8118@gmail.com" },
]
readme = "README.md"
keywords = ["django", "djangorestframework", "drf", "services", "service-layer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14",
    "djangorestframework-dataclasses>=1.3.1",
    # ``typing_extensions.Unpack`` is used at runtime in the strict
    # service / selector Protocols (PEP 692). Already required transitively
    # by ``djangorestframework-dataclasses``; declared here explicitly so we
    # don't depend on a transitive contract.
    # 4.13 is the release whose ``get_type_hints`` stops wrapping a
    # ``None``-defaulted parameter in ``Optional[...]`` on Python 3.10, which
    # otherwise hides every schema marker on such a parameter.
    # 4.14 is the release whose ``get_annotations`` reads in the
    # ``FORWARDREF`` format on Python 3.14. 4.13 numbers its own ``Format``
    # and hands the number to the standard library's ``annotationlib``,
    # where ``2`` is the internal ``VALUE_WITH_FAKE_GLOBALS`` and raises, so
    # ``provider_keys`` would read every typed provider as untyped there.
    "typing-extensions>=4.14",
    # The engine every spec dispatches through: the views hand a kernel spec
    # to its ``dispatch``. 0.8.0 is the first
    # release with the seats a serializer-backed edge needs: a Validator that
    # validates a many call once (``validated_many``), ``supports_partial`` per
    # instance, the call's pool seeds on ``ValidationContext.ambient``, a
    # presentation context on ``Presenter.presented``, ``extra_kwargs=`` on
    # ``dispatch``, the ``arguments`` channel on ``PermissionCheck`` and an
    # ``any`` output type. Its module graph has no ring either.
    # 0.14.0 adds the call's own context: one ``call_context`` dict per call,
    # handed to every stage and reserved as a pool name, which is what DRF's
    # serializer ``context`` is fed from. It also adds the ``shapes`` group of
    # output-shaping parameters, ``returns_many`` for a service presenting its
    # own return as a list, ``json_schema_extra`` on a parameter and an output
    # field, and a permission check reaching the call's seeds by naming them.
    # 0.15.0 adds ``Parameter.reflected``: a read this package takes off a
    # signature is marked, and the kernel fills a marked read from a registered
    # seed on any dispatch, which is what lets the edge stop compiling a seed's
    # name out of the reads per call.
    # 0.20.0 is the floor the move onto kernel specs is written against: the
    # call seeds ``request`` and ``view`` by name (``CALL_SEEDS``), the
    # registration check ``check_seeds``, and ``flat_arguments``, the reader a
    # query string or form body goes through before ``dispatch``.
    # 0.21.1 carries ``Validator.unsendable`` as the ABC's default, which the
    # serializer validator answers, and the refusal by ``check_seeds`` of an array
    # read that declares no ``items``.
    "django-service-specs>=0.21.1",
]

[project.optional-dependencies]
# OpenAPI / Swagger via drf-spectacular. Pulled in only when the user
# installs the extra and calls ``django_spec_rest.openapi.enable_openapi``.
spectacular = ["drf-spectacular>=0.27,<1.0"]
# django-filter, for a ``SelectorSpec.filter_set``: the kernel reads its filters
# as parameters and binds it, and imports django-filter lazily to do so. This
# package imports none of it. The floor is the kernel's own ``filter`` extra's.
filter = ["django-filter>=23.1"]

[project.urls]
Homepage = "https://github.com/Artui/django-spec-rest"
Repository = "https://github.com/Artui/django-spec-rest"
Issues = "https://github.com/Artui/django-spec-rest/issues"

[dependency-groups]
dev = [
    "ruff>=0.15.13",
    "ty>=0.0.32",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
    "flake8-tidy-imports>=4.12.0",
    "django-stubs>=6.0.4",
    "djangorestframework-stubs>=3.17.0",
    # Keep these two at the same floor as the ``spectacular`` / ``filter``
    # extras above. Both are declared twice — the extra is the consumer-facing
    # claim, the dev group is what the no-extras jobs (lint, the test matrix)
    # install. Under ``--resolution lowest-direct`` the *higher* of the two
    # wins, so a dev floor above the extra's silently substitutes itself for
    # the claim being checked and the floor job reports a version the extra
    # never promised. This entry read ``>=0.29.0`` while the extra said
    # ``>=0.27``, which is exactly that: 0.27 was never once resolved.
    "drf-spectacular>=0.27",
    "django-filter>=23.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "django_spec_rest/version.py"
pattern = "^__version__(?:\\s*:\\s*[A-Za-z][A-Za-z0-9_]*)?\\s*=\\s*[\"'](?P<version>[^\"']+)[\"']"

[tool.hatch.build.targets.wheel]
packages = ["django_spec_rest"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.conftest_settings"
asyncio_mode = "auto"
addopts = "--cov=django_spec_rest --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["django_spec_rest"]
branch = true

[tool.coverage.report]
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-tidy-imports
    "TID",
]
ignore = [
    "E203",
    "E501",
    "E231",
    "F811",
    "E722",
    "E741",
    # PEP 695 syntax. The package consistently uses ``TypeVar`` + ``Generic[T]``
    # and the explicit ``TypeAlias`` annotation, avoiding ``class C[T]:`` /
    # ``def f[T](...)`` / ``type Foo = ...`` — see the *Compatibility floor*
    # note in CLAUDE.md.
    "UP040",
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# I002 exempts the two file kinds that must not carry the future import: a
# re-export ``__init__.py`` has no annotations to postpone, and migrations are
# generated by Django, so the import would be rewritten out on every makemigrations.
"__init__.py" = ["F401", "I002"]
"**/migrations/*.py" = ["I002"]

[tool.ruff.lint.isort]
known-first-party = ["django_spec_rest"]
# CLAUDE.md requires this at the top of every annotated file; required-imports
# is what enforces it rather than leaving it to memory.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
# CLAUDE.md forbids every relative form, including single-dot. TID's default is
# "parents", which lets ``from .foo import bar`` through.
ban-relative-imports = "all"

# A TYPE_CHECKING guard exists to hide an import cycle from the interpreter
# while the type checker still sees it. Break the cycle instead: move the
# shared name into a leaf module of ``types/``, or type the parameter with a
# base class (CLAUDE.md, "Imports inside the package").
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TYPE_CHECKING".msg = "Break the import cycle instead of guarding it."
"typing_extensions.TYPE_CHECKING".msg = "Break the import cycle instead of guarding it."

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
root = ["./django_spec_rest"]

# bump-my-version drives `make release-bump` — it rewrites the version in
# django_spec_rest/version.py (the single source of truth; hatchling
# picks it up at build time via [tool.hatch.version]) and promotes the
# CHANGELOG [Unreleased] block under a new dated heading. Run via
# `uvx bump-my-version` (no permanent dependency added to the project).
[tool.bumpversion]
current_version = "0.1.0"
allow_dirty = false
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "django_spec_rest/version.py"
search = '__version__: str = "{current_version}"'
replace = '__version__: str = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] — {now:%Y-%m-%d}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/Artui/django-spec-rest/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/Artui/django-spec-rest/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/Artui/django-spec-rest/compare/v{current_version}...v{new_version}"""
